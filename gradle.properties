# Project-wide Gradle settings.

# Use AndroidX instead of the old support library (required for androidx.core,
# which replaces the removed Notification APIs used by the app).
android.useAndroidX=true

# The app does not (and should not) depend on any legacy android.support artifacts,
# so we do not need the Jetifier. Leaving this off speeds up the build.
android.enableJetifier=false

# Improves build performance for multi-module / incremental builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin/Java toolchain uses AndroidX resource namespacing by default; not needed here
# but explicit non-transitive R classes are a modern best practice for a single-module app.
android.nonTransitiveRClass=true

# AGP defaults to non-final resource IDs (needed for dynamic-feature/instant apps), but that
# makes R.id/R.menu fields non-constant, which breaks this app's existing
# switch (view.getItemId()) { case R.id.foo: ... } statements ("constant expression required").
# This is a single, non-dynamic-feature app module, so keeping final IDs is safe and avoids a
# large, risky refactor of ~20 switch statements to if/else chains.
android.nonFinalResIds=false
