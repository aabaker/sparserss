apply plugin: 'com.android.application'

android {
    namespace 'de.shandschuh.sparserss'

    compileSdk 35

    defaultConfig {
        applicationId "de.shandschuh.sparserss"
        minSdk 21
        targetSdk 35
        versionCode 87
        versionName "1.7"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    lint {
        lintConfig file('lint.xml')
        abortOnError false
    }
}

dependencies {
    // Provides NotificationCompat/NotificationManagerCompat
    implementation 'androidx.core:core:1.13.1'
}
